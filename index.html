<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FeltIt</title>
<style>
  :root {
    --bg: #ffffff;
    --border: #e2e2e5;
    --text: #1c1c1e;
    --muted: #6a6a6f;
    --accent: #E8724A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --border: #2c2c31;
      --text: #f2f2f4;
      --muted: #9a9aa1;
      --accent: #F08A63;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 96px 20px;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 2.25rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 32px; color: var(--muted); }
  nav a {
    display: inline-block;
    margin-right: 20px;
    color: var(--accent);
    text-decoration: none;
  }
  nav a:hover { text-decoration: underline; }
  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>

<h1>FeltIt</h1>
<p>An iOS application for logging body pain and sensation signals, identifying which training precedes them, and tracking changes in training load over time.</p>

</main>
</body>
</html>
